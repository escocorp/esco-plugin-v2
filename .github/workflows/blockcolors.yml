name: Update block_colors.png

on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get latest Mindustry release
        id: release
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/Anuken/Mindustry/releases/latest \
            | jq -r '.assets[] | select(.name == "Mindustry.jar") | .browser_download_url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download Mindustry
        run: |
          curl -L "${{ steps.release.outputs.url }}" -o Mindustry.jar

      - name: Extract block_colors.png
        run: |
          unzip -p Mindustry.jar sprites/block_colors.png > block_colors.png
          test -s block_colors.png

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add block_colors.png

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update block_colors.png"
          git push
