build:
  maxIssues: -1

config:
  validation: true
  warningsAsErrors: false

console-reports:
  active: true

style:
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false

complexity:
  LargeClass:
    excludes: ["**/PVars.kt", "**/KVars.kt"]
  TooManyFunctions:
    excludes: ["**/PVars.kt", "**/KVars.kt"]
  LongMethod:
    threshold: 80
  LongParameterList:
    active: false

potential-bugs: {}

exceptions:
  TooGenericExceptionCaught:
    active: false
